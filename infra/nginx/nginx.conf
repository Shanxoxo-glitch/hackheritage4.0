events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone: 100 requests per minute per IP for protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # ── Load Balanced Upstreams ──────────────────────────────────────────
    # Upstream pool for FastAPI Backend Gateway instances (Round-Robin with health check failover)
    upstream backend_cluster {
        least_conn; # Route traffic to instance with fewest active connections
        server backend:8400 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream pool for Perception Scoring Service (MuRIL & Threat models)
    upstream scoring_cluster {
        server scoring:8100 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # Upstream pool for Bayesian Risk Engine
    upstream risk_cluster {
        server risk-engine:8200 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # ── Main Load Balancer Server ─────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Gzip compression for high-performance payload transfer
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # Health Check endpoint for load balancer monitor
        location /lb-healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","load_balancer":"nginx","algorithm":"least_conn"}';
        }

        # 1. Perception Signals Traffic -> Distributed to Scoring Service Cluster
        location /v1/signals/ {
            proxy_pass http://scoring_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # 2. Evidential Risk Fusion Traffic -> Distributed to Risk Engine Cluster
        location /v1/fusion {
            proxy_pass http://risk_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # 3. All API Gateway & Interactions Streaming -> Backend Replicas Cluster
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-Sent Events (SSE) streaming support for Sahayak & CaseWriter
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
        }
    }
}
