version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sih-postgres
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: sih_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sih-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./services/backend
    container_name: sih-backend
    ports:
      - "8400:8400"
    environment:
      - DATABASE_URL=postgresql+asyncpg://sih_user:sih_password@postgres:5432/sih_db
      - REDIS_URL=redis://redis:6379/0
      - TWILIO_MOCK_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
