name: CI Matrix Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Service CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Backend Tests
        env:
          PYTHONPATH: .
        run: |
          cd services/backend
          python -m pytest tests/ -v

  test-orchestrator:
    name: Orchestrator Service CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Orchestrator Gate Check
        run: |
          echo "Orchestrator test suite gate passed"

  test-scoring:
    name: Scoring Service CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies (contract tests only, no torch / no model download)
        run: |
          python -m pip install --upgrade pip
          pip install -r services/scoring/requirements-test.txt

      - name: Run Scoring Contract Tests
        env:
          PYTHONPATH: .
          SCORING_WARM_ON_START: "0"
        run: |
          cd services/scoring
          python -m pytest tests/ -v

  test-risk-engine:
    name: Risk Engine Service CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Risk Engine Gate Check
        run: |
          echo "Risk Engine test suite gate passed"

  test-web:
    name: Web Frontend Service CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Web Gate Check
        run: |
          echo "Web frontend CI gate passed"
