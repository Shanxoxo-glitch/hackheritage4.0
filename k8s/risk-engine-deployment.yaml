apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: sih-distress
  labels:
    app: risk-engine
    tier: bayesian-fusion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-engine
  template:
    metadata:
      labels:
        app: risk-engine
        tier: bayesian-fusion
    spec:
      containers:
        - name: risk-engine
          image: sih-risk-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: risk-engine-service
  namespace: sih-distress
spec:
  type: ClusterIP
  selector:
    app: risk-engine
  ports:
    - name: http
      port: 8200
      targetPort: 8200
