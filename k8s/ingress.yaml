apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sih-ingress-loadbalancer
  namespace: sih-distress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
spec:
  rules:
    - http:
        paths:
          # 1. Perception Signals Traffic -> Scoring Cluster
          - path: /v1/signals
            pathType: Prefix
            backend:
              service:
                name: scoring-service
                port:
                  number: 8100

          # 2. Evidential Risk Fusion Traffic -> Risk Engine Cluster
          - path: /v1/fusion
            pathType: Prefix
            backend:
              service:
                name: risk-engine-service
                port:
                  number: 8200

          # 3. All Core API & Dialogue Traffic -> Scaled Backend Gateway Cluster
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8400
